# Datasources
#

Facciamo un esempio: ho creato a mano delle risorse sulla console di AWS.
Però non voglio ricrearle, ma voglio solo che Terraform le utilizzi come fonte di dati.
In questo caso, posso utilizzare il datasource `aws_instance` per recuperare le informazioni delle istanze EC2 esistenti.

#Esempio di utilizzo:

Recupero di informazioni relative alla pià recente ami linux.

provider "aws" {
  region: "us-east-1"
}

# 1 - Recupero la AMI più recente
data "aws_ami" "amazon_linux_2" {
  most_recent = true

  filter {
    name  = "name"
    values = ["amzn2-ami-hvm-*x86_64-gp2"]
  }

  owners = ["amazon"]
}

# 2 - Creo un'istanza EC2 usando l'AMI trovata

resource "aws_instance" "web" {
  ami           = data.aws_ami.amazon_linux_2.id
  instance_type = "t3.micro"

  tags = {
    Name = "web-server"
  }
}
