# Adesso lavoreremo con le variabili locali.
mkdir local_var
cd local_var

vim main.tf


required_providers {
  aws = {
    source  = "hashicorp/aws"
    version = "~> 4.16"
  }
required_version = ">= 1.2.0"
}

provider "aws" {
  region = "us-west-1"
}

locals {
  tags = {
  Name = "mioserver"
  Env = "Dev"
  }
}

resource "aws_instance" "book1" {
  ami  = "ami-00c39f71..."
  instance_type "t2.micro"
  tags = local.tags 
}
