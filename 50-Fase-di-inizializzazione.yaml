# Fase di inizializzazione

Quando fai: 

$ terraform init

Terraform scarica i provider secondo la versione che abbiamo fissato all'inizio.

Viene calcolato l'hash del provider e poi viene salvato nel file ".terraform.lock.hcl", 
affiché ogni volta che si fa "terraform init", non viene scaricata una eventuale 
versione nuova del provider di AWS per esempio e venga usata la versione con cui si è fatto
la prima volta "terraform init"

Se si vuole invece aggiornare il provider si deve fare: 

$ terraform init -upgrade

In questo caso viene ricalcolato l'hash della versione del provider e viene 
aggiornato il file .terraform.lock.hcl.

E' sempre bene pushare il .terraform.lock.hcl

Ricordiamo che il seguente comando serve a formattare correttamente eventuali file, formattati male: 

$ terraform fmt

Se i file di configurazione sono scritti con una formattazione corretta allora non restituisce nulla a video. 
Se c'è una indentazione sbagliata, la corregge.

Invece il seguente comando serve a controllare che la configurazione sia corretta e che non manchino 
relazioni tra le risorse.

$ terraform plan

QUESTA è LA SEQUENZA CORRETTA: 

terraform fmt       # allinea il codice al formato standard
terraform init      # scarica provider e backend
terraform validate  # controlla sintassi e coerenza logica
terraform plan      # mostra le modifiche che verranno effettuate
terraform apply/destroy     # applica le modifiche sull’infrastruttura

