# State File

Prima di parlare del terraform.tfstate, cioè delle state di Terraform, dobbiamo parlare della differenza tra: 

- terraform.tf;
- main.tf;

Solitamente nel terraform.tf si mettono info come versione di terraform, providers con le loro versioni e info sulla definizione del backend: 

terraform {
  required_version = ">= 1.0.0"

  required_providers {
    aws = {
      source  = "hashicorp/aws"
      version = "~> 4.0"
    }
  }

  backend "s3" {
    bucket         = "mio-terraform-state-bucket"
    key            = "env/prod/terraform.tfstate"
    region         = "eu-west-1"
    encrypt        = true
    dynamodb_table = "terraform-locks"
  }
}

provider "aws" {
  region  = var.aws_region
  profile = var.aws_profile
}

Mentre nel main.tf si mettono i blocchi delle risorse da creare.

!!! Nel terraform.tfstate viene salvato lo stato corrente dell'infrastruttura. 
Questo file viene salvato nella directory corrente ma si consiglia di salvarlo in un 
bucket S3. 

### Esempio di backend.tf 

terraform {
  backend "s3" {
    bucket         = "mio-terraform-state-bucket"
    key            = "env/prod/terraform.tfstate"
    region         = "eu-west-1"
    encrypt        = true
    dynamodb_table = "terraform-locks"
  }
}

!!! Terraform utilizza il locking remoto: questo significa che se un altro utente sta modificando il terraform.tfstate sul s3 
io non posso modificarlo in modo concorrenziale. 

Possiamo avere anche un meccanismo che preserva il terraform.tfstate in questa maniera: 

Ecco in pillole come metti su DynamoDB il lock per lo state e cosa succede “sotto al cofano”:

Crei la tabella DynamoDB
Puoi farlo da CLI (o Console), con uno schema minimo:

aws dynamodb create-table \
  --table-name terraform-locks \
  --attribute-definitions AttributeName=LockID,AttributeType=S \
  --key-schema AttributeName=LockID,KeyType=HASH \
  --billing-mode PAY_PER_REQUEST
LockID sarà la chiave primaria del lock (Terraform mette lì il nome del tuo workspace o del path S3).

Con PAY_PER_REQUEST non ti devi preoccupare di throughput.

Configuri il backend Terraform
Nel file terraform.tf (o backend.tf) metti:

terraform {
  backend "s3" {
    bucket         = "mio-terraform-state-bucket"
    key            = "env/prod/terraform.tfstate"
    region         = "eu-west-1"
    encrypt        = true
    dynamodb_table = "terraform-locks"
  }
}
Cosa succede “praticamente”

Lock prima: appena inizi un plan o un apply, Terraform fa una PutItem condizionale su DynamoDB per inserire un record con LockID.

Se il record esiste già, significa che qualcun altro sta già lavorando sullo stesso state: Terraform aspetta o fallisce con errore.

Una volta finito, Terraform fa una DeleteItem su quel record, liberando il lock.

Il file terraform.tfstate resta fisicamente su S3 (versionato, se hai abilitato il versioning), ma il lock su DynamoDB garantisce che non ci siano due scritture concorrenti che lo corrompano.

In questo modo, anche team distribuiti o pipeline CI possono operare in sicurezza sullo stesso backend senza sovrascriversi a vicenda.
