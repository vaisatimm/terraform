I workspace ci consentono di deployare più ambienti senza problemi di overlapping, usando lo stesso codice.

Ogni workspace ha uno state file separato.

Nelle vecchie versioni di terraform i workspace si chiamavano terraform environments. 


### video 76

terrafor workspace show
default



$:~/desk/terraform# terraform workspace show
default ### L'UNICO WORKSPACE, QUELLO DI DEFAULT
 
$:~/desk/terraform# mkdir workspace_test
 
$:~/desk/terraform# cd workspace_test
 

creiamo uno nuovo: 

$:~/desk/terraform/workspace_test# terraform workspace new prod
Created and switched to workspace "prod"!

You're now on a new, empty workspace. Workspaces isolate their state,
so if you run "terraform plan" Terraform will not see any existing state
for this configuration.
 
$:~/desk/terraform/workspace_test# terraform workspace show
prod

$:~/desk/terraform/workspace_test# terraform workspace list
  default
* prod



C'è da sottolineare che il comando creazione di un nuovo workspace creerà dei file e delle directory
nella directory corrente come vedi di seguito:

~/desk/terraform/workspace_test# ll
total 0
drwxrwxrwx 1 vaisatimm vaisatimm 4096 Jun  8 23:49 ..
drwxrwxrwx 1 vaisatimm vaisatimm 4096 Jun  8 23:49 terraform.tfstate.d
drwxrwxrwx 1 vaisatimm vaisatimm 4096 Jun  8 23:49 .
drwxrwxrwx 1 vaisatimm vaisatimm 4096 Jun  8 23:49 .terraform
 (master)

Se provi a cancellare il workspace su cui ti trovi adesso ti va in errore; prima bisogna passare 
ad un altro workspace e poi cancellare: 

$:~/desk/terraform/workspace_test# terraform workspace delete prod

!!! IMPORTANTE : NON C'è BISOGNO CHE NOI CREIAMO UNA CARTELLA PER OGNI AMBIENTE DI WORKSPACE PERCHé
TERRAFORM LO FARA' PER NOI METTENDONE UNA NUOVA PER OGNI WORKSPACE NELLA CARTELLA: terraform.tfstate.d 

$ ls 
stage/ dev/ prod/


